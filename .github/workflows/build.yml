name: Build BeatMaker apps

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build iOS (unsigned, for testing)"
        type: boolean
        default: false
      windows:
        description: "Also build Windows"
        type: boolean
        default: false
      macos:
        description: "Also build macOS"
        type: boolean
        default: false
      linux:
        description: "Also build Linux"
        type: boolean
        default: false
      allow_links:
        description: "Allow song links (turn off for Play Store builds)"
        type: boolean
        default: true

env:
  ALLOW_LINKS: ${{ github.event_name != 'workflow_dispatch' || inputs.allow_links }}
  # serious_python installs the engine's Python packages here, and the Android/iOS
  # builds embed them from here (they fail if this isn't set)
  SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/mobile/build/site-packages
  # serious_python 6: where the packaged Python app (engine) is staged for the native build
  SERIOUS_PYTHON_APP: ${{ github.workspace }}/mobile/build/python-app
  # Python 3.12: the version whose mobile NumPy wheels this app is known to run with
  SERIOUS_PYTHON_VERSION: "3.12"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # to publish the phone APK as a release (a direct download link)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --project-name beatmaker --org app.beatmaker --platforms=android,ios,macos,windows,linux "$RUNNER_TEMP/template"
          python tool/merge_template.py "$RUNNER_TEMP/template" mobile
          cd mobile && python ../tool/patch_platforms.py
      - name: App icon
        run: pip install pillow && python tool/apply_icons.py
      - name: Get packages
        working-directory: mobile
        run: flutter pub get
      - name: Bundle the beat engine (Python + NumPy)
        run: bash tool/prepare_python.sh Android
      # Sign every build with the same key so new versions install over the old one.
      # Secrets (Settings > Secrets and variables > Actions): ANDROID_KEYSTORE_BASE64 (the
      # keystore file, base64) and ANDROID_KEYSTORE_PASSWORD. Without them the build uses
      # Flutter's throwaway debug key, which can't update an installed app.
      - name: Signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No signing secrets set: this APK can't update an installed BeatMaker (uninstall first). See the comment above this step."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/beatmaker-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=beatmaker\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/beatmaker-release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > mobile/android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build APKs
        working-directory: mobile
        # the build number rises every run, so Android sees each one as an update
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --dart-define=ALLOW_LINKS=${{ env.ALLOW_LINKS }}
      - uses: actions/upload-artifact@v6
        with:
          name: BeatMaker-Android
          path: mobile/build/app/outputs/flutter-apk/*.apk
      # Each build is published as a release with just the phone APK attached, so the newest
      # version is always one file on one fixed link (no zip):
      #   https://github.com/<owner>/<repo>/releases/latest/download/BeatMaker-arm64-v8a.apk
      # Nothing is deleted; older releases stay on the Releases page.
      - name: Publish the phone APK (direct download link)
        # only builds signed with the fixed key, so everything on the link installs as an update
        if: env.ALLOW_LINKS == 'true' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk BeatMaker-arm64-v8a.apk
          tag="android-build-${GITHUB_RUN_NUMBER}"
          {
            echo "BeatMaker for Android phones (arm64-v8a, fits almost every modern phone)."
            echo
            echo "Install BeatMaker-arm64-v8a.apk over your current app; your beats, tags and settings are kept."
            echo
            echo "What changed: $(git log -1 --format=%s)"
            echo "Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > notes.md
          gh release create "$tag" BeatMaker-arm64-v8a.apk --target "$GITHUB_SHA" \
            --title "BeatMaker build ${GITHUB_RUN_NUMBER}" --notes-file notes.md --latest
          echo "Download: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest/download/BeatMaker-arm64-v8a.apk" >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS (unsigned)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --project-name beatmaker --org app.beatmaker --platforms=android,ios,macos,windows,linux "$RUNNER_TEMP/template"
          python tool/merge_template.py "$RUNNER_TEMP/template" mobile
          cd mobile && python ../tool/patch_platforms.py
      - run: pip install pillow && python tool/apply_icons.py
      - working-directory: mobile
        run: flutter pub get
      - run: bash tool/prepare_python.sh iOS
      - working-directory: mobile
        run: |
          flutter build ios --release --no-codesign --dart-define=ALLOW_LINKS=${{ env.ALLOW_LINKS }}
          cd build/ios/iphoneos && zip -qr ../../BeatMaker-iOS-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v6
        with:
          name: BeatMaker-iOS-unsigned
          path: mobile/build/BeatMaker-iOS-unsigned.zip

  windows:
    name: Windows
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          flutter create --project-name beatmaker --org app.beatmaker --platforms=android,ios,macos,windows,linux "$RUNNER_TEMP/template"
          python tool/merge_template.py "$RUNNER_TEMP/template" mobile
          cd mobile && python ../tool/patch_platforms.py
      - run: pip install pillow && python tool/apply_icons.py
      - working-directory: mobile
        run: flutter pub get
      - run: bash tool/prepare_python.sh Windows
      - working-directory: mobile
        run: flutter build windows --release --dart-define=ALLOW_LINKS=${{ env.ALLOW_LINKS }}
      - uses: actions/upload-artifact@v6
        with:
          name: BeatMaker-Windows
          path: mobile/build/windows/x64/runner/Release/

  macos:
    name: macOS
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          flutter create --project-name beatmaker --org app.beatmaker --platforms=android,ios,macos,windows,linux "$RUNNER_TEMP/template"
          python tool/merge_template.py "$RUNNER_TEMP/template" mobile
          cd mobile && python ../tool/patch_platforms.py
      - run: pip install pillow && python tool/apply_icons.py
      - working-directory: mobile
        run: flutter pub get
      - run: bash tool/prepare_python.sh macOS
      - working-directory: mobile
        run: |
          flutter build macos --release --dart-define=ALLOW_LINKS=${{ env.ALLOW_LINKS }}
          cd build/macos/Build/Products/Release && zip -qr ../../../../BeatMaker-macOS.zip *.app
      - uses: actions/upload-artifact@v6
        with:
          name: BeatMaker-macOS
          path: mobile/build/BeatMaker-macOS.zip

  linux:
    name: Linux
    if: github.event_name == 'workflow_dispatch' && inputs.linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          flutter create --project-name beatmaker --org app.beatmaker --platforms=android,ios,macos,windows,linux "$RUNNER_TEMP/template"
          python tool/merge_template.py "$RUNNER_TEMP/template" mobile
          cd mobile && python ../tool/patch_platforms.py
      - run: pip install pillow && python tool/apply_icons.py
      - working-directory: mobile
        run: flutter pub get
      - run: bash tool/prepare_python.sh Linux
      - working-directory: mobile
        run: flutter build linux --release --dart-define=ALLOW_LINKS=${{ env.ALLOW_LINKS }}
      - uses: actions/upload-artifact@v6
        with:
          name: BeatMaker-Linux
          path: mobile/build/linux/x64/release/bundle/
